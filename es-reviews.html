<!-- ================================================================
     EcoSave — ОТЗЫВЫ
     Блок T123. Выше на странице — скрытый блок «Каталог товаров»
     с разделом «Отзывы».

     Главная:            mode: 'grid',   limit: 3
     Страница отзывов:   mode: 'slider', limit: 0
     ================================================================ -->

<section class="es-rev" id="esRev">
  <div class="es-rev__head">
    <h2 class="es-rev__title" id="esRevTitle">Отзывы</h2>

    <a class="es-rev__all" id="esRevAll" href="/reviews"
      >Смотреть все
      <svg
        width="20"
        height="13"
        viewBox="0 0 20 13"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M13 1L18.5 6.5L13 12M18 6.5H1"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </a>

    <div class="es-rev__nav" id="esRevNav" hidden>
      <button
        class="es-rev__arrow"
        id="esRevPrev"
        aria-label="Предыдущие отзывы"
      >
        <svg
          width="16"
          height="11"
          viewBox="0 0 18 12"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M6.5 1L1.5 6L6.5 11M2 6H17"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <button
        class="es-rev__arrow"
        id="esRevNext"
        aria-label="Следующие отзывы"
      >
        <svg
          width="16"
          height="11"
          viewBox="0 0 18 12"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M11.5 1L16.5 6L11.5 11M16 6H1"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>
  </div>

  <div class="es-rev__list" id="esRevList"></div>
</section>

<style>
  .es-rev {
    --es-green: #4d9033;
    --es-green-dark: #447f2d;
    --es-green-soft: #cfe3cf;
    --es-quote: #7fb06a;
    --es-ink: #1a1a1a;
    --es-muted: #6e6e6e;
    --es-card: #f7f7f7;
    --es-radius: 14px;
    --es-per-view: 3;
    --es-gap: 24px;
    color: var(--es-ink);
    font-family: Inter, Sans-Serif;
    max-width: 1200px;
    margin: 0 auto;
    padding: 44px 20px;
    box-sizing: border-box;
  }
  .es-rev *,
  .es-rev *::before,
  .es-rev *::after {
    box-sizing: border-box;
  }

  /* ---------- шапка ---------- */
  .es-rev__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 22px;
  }
  .es-rev__title {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .es-rev__all {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--es-green);
    text-decoration: none;
    font-size: 16px;
  }
  .es-rev__all:hover {
    color: var(--es-green-dark);
  }
  .es-rev__all[hidden],
  .es-rev__nav[hidden] {
    display: none;
  }

  .es-rev__nav {
    display: flex;
    gap: 12px;
  }
  .es-rev__arrow {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--es-green);
    color: #fff;
    transition: background 0.15s ease;
  }
  .es-rev__arrow:disabled {
    background: var(--es-green-soft);
    cursor: default;
  }

  /* ---------- раскладка ---------- */
  .es-rev__list {
    display: grid;
    grid-template-columns: repeat(var(--es-per-view), 1fr);
    gap: var(--es-gap);
  }
  .es-rev__list[data-mode="slider"] {
    display: flex;
    overflow-x: auto;
    scroll-behavior: smooth;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .es-rev__list[data-mode="slider"]::-webkit-scrollbar {
    display: none;
  }
  .es-rev__list[data-mode="slider"] > .es-review {
    flex: 0 0
      calc(
        (100% - (var(--es-per-view) - 1) * var(--es-gap)) / var(--es-per-view)
      );
    scroll-snap-align: start;
  }

  /* ---------- карточка ---------- */
  .es-rev figure,
  .es-rev blockquote,
  .es-rev figcaption {
    margin: 0;
  }
  .es-review {
    background: var(--es-card);
    border-radius: var(--es-radius);
    padding: 24px;
    display: flex;
    flex-direction: column;
    min-width: 0;
    margin: 0;
  }
  .es-review__top {
    display: flex;
    gap: 20px;
    margin-bottom: 28px;
  }
  .es-review__quote {
    color: var(--es-quote);
    flex: none;
    margin-top: 2px;
  }
  .es-review__text {
    font-size: 15px;
    line-height: 1.6;
    color: #3a3a3a;
    margin: 0;
  }
  .es-review__person {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: auto;
    min-width: 0;
  }
  .es-review__ava {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    flex: none;
    overflow: hidden;
    background: #e7eae6;
  }
  .es-review__ava img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .es-review__who {
    min-width: 0;
  }
  .es-review__name {
    display: block;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
  }
  .es-review__role {
    display: block;
    font-size: 14px;
    color: var(--es-muted);
    margin-top: 4px;
  }
  .es-rev__empty {
    color: var(--es-muted);
    font-size: 15px;
    padding: 20px 0;
  }

  /* ---------- адаптив ---------- */
  @media (max-width: 1000px) {
    .es-rev {
      --es-per-view: 2;
      --es-gap: 16px;
    }
    .es-rev__title {
      font-size: 26px;
    }
    .es-review {
      padding: 24px;
    }
    .es-review__top {
      gap: 16px;
      margin-bottom: 22px;
    }
  }
  @media (max-width: 600px) {
    .es-rev {
      --es-per-view: 1;
      padding: 44px 16px;
    }
    .es-rev__title {
      font-size: 20px;
    }
    .es-rev__all {
      font-size: 14px;
      gap: 8px;
    }
    .es-rev__arrow {
      width: 38px;
      height: 38px;
    }
    .es-review {
      padding: 20px;
    }
    .es-review__text {
      font-size: 14px;
    }
    .es-review__ava {
      width: 46px;
      height: 46px;
    }
    .es-review__name {
      font-size: 15px;
    }
    .es-review__role {
      font-size: 13px;
    }
    /* на главной видна одна карточка */
    .es-rev__list[data-mode="grid"] > *:nth-child(n + 2) {
      display: none;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .es-rev__list {
      scroll-behavior: auto;
    }
    .es-rev * {
      transition: none !important;
    }
  }

  .es-source-loading {
    opacity: 0 !important;
    pointer-events: none !important;
  }
  .es-source-hidden {
    display: none !important;
  }
</style>

<script>
  (function () {
    /* ============================================================
     ES_CONFIG
     title    — заголовок секции
     mode     — 'grid'   сетка со ссылкой «Смотреть все» (главная)
                'slider' карусель со стрелками (страница отзывов)
     limit    — сколько отзывов выводить. 0 = все
     allUrl   — адрес страницы отзывов для ссылки «Смотреть все»
     partUid  — идентификатор раздела «Отзывы» в каталоге Tilda
     recid    — запасной вариант: номер блока на ЭТОЙ странице
     ============================================================ */
    var ES_CONFIG = {
      title: "Отзывы",
      mode: "grid",
      limit: 3,
      allUrl: "/reviews",
      partUid: "",
      recid: "",
    };

    var QUOTE =
      '<svg width="34" height="26" viewBox="0 0 34 26" fill="none" aria-hidden="true">' +
      '<path d="M2 24V13.5C2 6.6 6.4 2.4 13 2v4.2c-3.4.5-5.3 2.6-5.6 5.4H13V24H2z" ' +
      'stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>' +
      '<path d="M21 24V13.5C21 6.6 25.4 2.4 32 2v4.2c-3.4.5-5.3 2.6-5.6 5.4H32V24H21z" ' +
      'stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>';

    var titleEl = document.getElementById("esRevTitle");
    var allEl = document.getElementById("esRevAll");
    var navEl = document.getElementById("esRevNav");
    var prev = document.getElementById("esRevPrev");
    var next = document.getElementById("esRevNext");
    var list = document.getElementById("esRevList");

    var isSlider = ES_CONFIG.mode === "slider";

    titleEl.textContent = ES_CONFIG.title;
    list.setAttribute("data-mode", isSlider ? "slider" : "grid");
    allEl.hidden = isSlider || !ES_CONFIG.allUrl;
    navEl.hidden = !isSlider;
    if (ES_CONFIG.allUrl) allEl.setAttribute("href", ES_CONFIG.allUrl);

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[c];
      });
    }

    /* ---------- скрываем магазинные блоки ---------- */
    function sourceBlocks() {
      return [].filter.call(
        document.querySelectorAll('[id^="rec"]'),
        function (el) {
          return el.querySelector(
            '.js-product, .t-store, .js-store, .t-store__grid-cont, [class*="t-store__"]',
          );
        },
      );
    }
    var sourcesDone = false;
    (function keepHidden(n) {
      sourceBlocks().forEach(function (b) {
        b.classList.add(sourcesDone ? "es-source-hidden" : "es-source-loading");
      });
      if (n < 100)
        setTimeout(function () {
          keepHidden(n + 1);
        }, 250);
    })(0);

    /* ---------- сбор отзывов ---------- */
    // Краткое описание: «Текст отзыва | Должность, регион»
    function collect() {
      var cards;
      if (ES_CONFIG.partUid) {
        cards = document.querySelectorAll(
          '.js-product[data-product-part-uid="' + ES_CONFIG.partUid + '"]',
        );
      } else if (ES_CONFIG.recid) {
        var b = document.getElementById("rec" + ES_CONFIG.recid);
        cards = b ? b.querySelectorAll(".js-product[data-product-uid]") : [];
      } else {
        cards = document.querySelectorAll(".js-product[data-product-uid]");
      }
      if (!cards.length) return null;

      return [].map
        .call(cards, function (c) {
          var nameEl = c.querySelector(
            ".js-store-prod-name, .t-store__card__title",
          );
          var descrEl = c.querySelector(
            ".js-store-prod-descr, .t-store__card__descr",
          );
          var raw = descrEl
            ? descrEl.textContent.replace(/\s+/g, " ").trim()
            : "";
          var parts = raw.split("|");
          return {
            text: (parts.shift() || "").trim(),
            role: parts.join("|").trim(),
            name: nameEl ? nameEl.textContent.trim() : "",
            ava: c.getAttribute("data-product-img") || "",
          };
        })
        .filter(function (r) {
          return r.text || r.name;
        });
    }

    /* ---------- рендер ---------- */
    function render(items) {
      if (!items.length) {
        list.innerHTML =
          '<div class="es-rev__empty">Отзывы не загрузились.</div>';
        navEl.hidden = true;
        return;
      }
      var shown = ES_CONFIG.limit ? items.slice(0, ES_CONFIG.limit) : items;

      list.innerHTML = shown
        .map(function (r) {
          return (
            '<figure class="es-review">' +
            '<div class="es-review__top">' +
            '<span class="es-review__quote">' +
            QUOTE +
            "</span>" +
            '<blockquote class="es-review__text">' +
            esc(r.text) +
            "</blockquote>" +
            "</div>" +
            '<figcaption class="es-review__person">' +
            '<span class="es-review__ava">' +
            (r.ava
              ? '<img src="' +
                esc(r.ava) +
                '" alt="' +
                esc(r.name) +
                '" loading="lazy">'
              : "") +
            "</span>" +
            '<span class="es-review__who"><span class="es-review__name">' +
            esc(r.name) +
            "</span>" +
            (r.role
              ? '<span class="es-review__role">' + esc(r.role) + "</span>"
              : "") +
            "</span>" +
            "</figcaption></figure>"
          );
        })
        .join("");

      if (isSlider) initSlider();
    }

    /* ---------- слайдер ---------- */
    function initSlider() {
      function step() {
        var first = list.querySelector(".es-review");
        if (!first) return list.clientWidth;
        var gap =
          parseFloat(
            getComputedStyle(list).columnGap || getComputedStyle(list).gap,
          ) || 0;
        var per = Math.max(
          1,
          Math.round(list.clientWidth / (first.offsetWidth + gap)),
        );
        return (first.offsetWidth + gap) * per;
      }
      function sync() {
        var max = list.scrollWidth - list.clientWidth - 1;
        var fits = max <= 0;
        navEl.hidden = fits;
        prev.disabled = fits || list.scrollLeft <= 0;
        next.disabled = fits || list.scrollLeft >= max;
      }
      prev.onclick = function () {
        list.scrollBy({ left: -step(), behavior: "smooth" });
      };
      next.onclick = function () {
        list.scrollBy({ left: step(), behavior: "smooth" });
      };
      list.addEventListener("scroll", sync, { passive: true });
      window.addEventListener("resize", sync);
      sync();
      setTimeout(sync, 400);
    }

    /* ---------- ожидание загрузки ---------- */
    var tries = 0;
    (function wait() {
      var items = collect();
      if (items) {
        sourcesDone = true;
        render(items);
        return;
      }
      if (++tries > 80) {
        sourcesDone = true;
        render([]);
        console.warn(
          "EcoSave: отзывы не найдены. Проверьте partUid/recid в ES_CONFIG " +
            "и лимит товаров в блоке «Каталог товаров».",
        );
        return;
      }
      setTimeout(wait, 250);
    })();
  })();
</script>
